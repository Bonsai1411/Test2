<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mystery Master – Geburtstagsanimation Labor 1.3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#happy{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease}
#glow{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.12),rgba(0,0,0,0) 48%);opacity:0;transition:opacity .7s}
#nameWrap{position:absolute;left:5vw;right:5vw;top:64%;text-align:center;z-index:5;pointer-events:none}
#name{display:inline-block;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(68px,16vw,172px);letter-spacing:.025em;color:#ffd45a;text-shadow:0 0 5px #fff2b0,0 0 18px rgba(255,205,55,.95),0 0 44px rgba(255,150,20,.78);opacity:0;filter:blur(10px);transform:scale(.9);transition:opacity .8s,filter .8s,transform .8s}
#name.show{opacity:1;filter:blur(0);transform:scale(1);animation:nameWobble 2.8s ease-in-out infinite,nameGlow 2.1s ease-in-out infinite;transform-style:preserve-3d}
#name.dissolve{opacity:0;filter:blur(10px);transform:scale(1.12);transition:opacity 1.5s,filter 1.5s,transform 1.5s}
#particleCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}
#silhouette{position:absolute;left:50%;top:54%;width:min(50vw,310px);aspect-ratio:0.714;transform:translate(-50%,-50%) scale(.76);border:3px solid rgba(255,245,205,.95);border-radius:14px;background:rgba(255,238,165,.10);box-shadow:0 0 20px rgba(255,240,180,.8),0 0 60px rgba(255,190,70,.55);opacity:0;filter:blur(8px);z-index:8;transition:opacity 1s,filter 1s,transform 1s}
#silhouette.show{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1);background:rgba(255,235,150,.28)}
#silhouette.bright{opacity:1;filter:blur(1px) brightness(2.8);transform:translate(-50%,-50%) scale(1.025);background:rgba(255,250,220,.96);box-shadow:0 0 35px rgba(255,255,255,1),0 0 95px rgba(255,220,120,.95),0 0 150px rgba(255,170,40,.75);transition:all .7s ease}
#card{position:absolute;left:50%;top:54%;width:min(50vw,310px);height:auto;transform:translate(-50%,-50%) scale(.94);opacity:0;filter:blur(10px) brightness(1.25);z-index:9;border-radius:12px;box-shadow:0 0 26px rgba(255,255,255,.7),0 0 70px rgba(255,190,60,.55);transition:opacity .8s,filter .8s,transform .8s}
#card.show{opacity:1;filter:blur(0) brightness(1);transform:translate(-50%,-50%) scale(1)}
#controls{position:fixed;z-index:30;left:8px;right:8px;bottom:8px;padding:9px;border:1px solid #333;border-radius:12px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
input,select,button{appearance:none;border:1px solid #555;border-radius:7px;background:#111;color:#eee;padding:9px 10px;font:14px monospace}
input{width:130px}
button:active{transform:scale(.97)}
#status{width:100%;text-align:center;color:#aaa;font:12px monospace;min-height:16px}

@keyframes nameWobble{
  0%{transform:perspective(650px) scale(1) rotateY(-14deg) rotateZ(-1.4deg)}
  20%{transform:perspective(650px) scale(1.035) rotateY(10deg) rotateZ(1deg)}
  43%{transform:perspective(650px) scale(.99) rotateY(-8deg) rotateZ(-.7deg)}
  68%{transform:perspective(650px) scale(1.045) rotateY(13deg) rotateZ(1.2deg)}
  100%{transform:perspective(650px) scale(1) rotateY(-14deg) rotateZ(-1.4deg)}
}
@keyframes nameGlow{
  0%,100%{color:#ffd45a;filter:brightness(1);text-shadow:0 0 5px #fff2b0,0 0 18px rgba(255,205,55,.95),0 0 44px rgba(255,150,20,.78)}
  30%{color:#ffe58b;filter:brightness(1.25);text-shadow:0 0 9px #fff8d5,0 0 28px rgba(255,220,90,1),0 0 62px rgba(255,165,25,.92)}
  58%{color:#ffc83d;filter:brightness(.95);text-shadow:0 0 4px #ffe9a0,0 0 15px rgba(255,190,45,.9),0 0 38px rgba(255,135,10,.72)}
  82%{color:#fff0ad;filter:brightness(1.35);text-shadow:0 0 11px white,0 0 32px rgba(255,225,105,1),0 0 72px rgba(255,175,35,.95)}
}

</style>
</head>
<body>
<div id="stage">
  <img id="happy" src="happy.gif" alt="">
  <div id="glow"></div>
  <div id="nameWrap"><div id="name"></div></div>
  <canvas id="particleCanvas"></canvas>
  <div id="silhouette"></div>
  <img id="card" alt="Vorhersagekarte">
</div>

<div id="controls">
  <input id="nameInput" value="Daniel" aria-label="Name">
  <select id="cardSelect">
    <option value="pik_7">Pik 7</option>
    <option value="herz_12">Herz Dame</option>
    <option value="karo_1">Karo Ass</option>
    <option value="kreuz_13">Kreuz König</option>
  </select>
  <button id="startBtn">GEBURTSTAG TESTEN</button>
  <button id="resetBtn">RESET</button>
  <div id="status">Geburtstagslabor bereit.</div>
</div>

<audio id="fireworks" preload="auto" src="feuerwerk.mp3"></audio>
<audio id="party" preload="auto" src="feier.mp3"></audio>
<audio id="fanfare" preload="auto" src="fanfare.mp3"></audio>

<script>
/*
MYSTERY MASTER – GEBURTSTAGSANIMATION LABOR 1.3

Benötigte Dateien im selben Ordner:
  happy.gif
  feuerwerk.mp3
  feier.mp3
  fanfare.mp3
sowie Karten unter:
  karten/<kartenname>.png

Erster dramaturgischer Entwurf:
  0.0 s  happy.gif + Feuerwerk
  3.0 s  Name erscheint
 10.0 s  Name löst sich auf / dichter, langsamer Partikelregen
 10.5 s  Crossfade Feuerwerk -> Feier
 14.0 s  Partikel beginnen sich zur Kartenfläche zu verdichten
 17.2 s  Kartenfläche ist als Partikelsilhouette gefüllt
 18.2 s  Silhouette blendet hell auf
 19.0 s  Karte erscheint + Fanfare
 21.0 s  Karte bleibt stehen
*/

const happy=document.getElementById("happy");
const glow=document.getElementById("glow");
const nameEl=document.getElementById("name");
const canvas=document.getElementById("particleCanvas");
const ctx=canvas.getContext("2d");
const silhouette=document.getElementById("silhouette");
const card=document.getElementById("card");
const fireworks=document.getElementById("fireworks");
const party=document.getElementById("party");
const fanfare=document.getElementById("fanfare");
const statusEl=document.getElementById("status");
const nameInput=document.getElementById("nameInput");
const cardSelect=document.getElementById("cardSelect");

let timers=[], particles=[], raf=0, running=false, gather=0;

function status(s){statusEl.textContent=s}
function later(ms,fn){const id=setTimeout(fn,ms);timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",resize); resize();

function stopAudio(a){a.pause();a.currentTime=0;a.volume=1}
function fadeAudio(a,from,to,duration){
  const started=performance.now(); a.volume=from;
  function tick(now){
    const p=Math.min(1,(now-started)/duration);
    a.volume=from+(to-from)*p;
    if(p<1 && running) requestAnimationFrame(tick);
    else if(to===0) a.pause();
  }
  requestAnimationFrame(tick);
}

function reset(){
  running=false; clearTimers(); cancelAnimationFrame(raf);
  particles=[];ctx.clearRect(0,0,innerWidth,innerHeight);gather=0;
  happy.style.opacity=0;glow.style.opacity=0;
  nameEl.className="";nameEl.textContent="";
  silhouette.className="";card.className="";card.src="";
  [fireworks,party,fanfare].forEach(stopAudio);
  status("Geburtstagslabor bereit.");
}

function makeParticles(count=1500){
  particles=[];
  const cx=innerWidth/2, cy=innerHeight*.54;
  const cardW=Math.min(innerWidth*.50,310), cardH=cardW/0.714;
  for(let i=0;i<count;i++){
    let tx,ty;
    // 92 % der Partikel enden INNERHALB der Kartenfläche.
    // Dadurch entsteht eine gefüllte Lichtkarte statt nur einer Kontur.
    if(Math.random()<.92){
      const margin=5;
      tx=cx-cardW/2+margin+Math.random()*(cardW-margin*2);
      ty=cy-cardH/2+margin+Math.random()*(cardH-margin*2);
    } else {
      // wenige Funken betonen zusätzlich die Kontur
      const edge=Math.floor(Math.random()*4);
      if(edge===0){tx=cx-cardW/2+Math.random()*cardW;ty=cy-cardH/2}
      else if(edge===1){tx=cx+cardW/2;ty=cy-cardH/2+Math.random()*cardH}
      else if(edge===2){tx=cx-cardW/2+Math.random()*cardW;ty=cy+cardH/2}
      else {tx=cx-cardW/2;ty=cy-cardH/2+Math.random()*cardH}
    }
    particles.push({
      x:(i%3===0 ? -30-Math.random()*120 : (i%3===1 ? innerWidth+30+Math.random()*120 : Math.random()*innerWidth)),
      y:(i%3===2 ? -40-Math.random()*innerHeight*.75 : Math.random()*innerHeight*.72),
      vx:(i%3===0 ? 1.0+Math.random()*1.5 : (i%3===1 ? -1.0-Math.random()*1.5 : (Math.random()-.5)*.8)),
      vy:(i%3===2 ? .45+Math.random()*1.0 : .15+Math.random()*.55),
      r:.7+Math.random()*2.4,
      a:.38+Math.random()*.62,
      tw:Math.random()*Math.PI*2,
      tx,ty
    });
  }
}

function animateParticles(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of particles){
    if(gather>0){
      const pull=.0025+.024*gather;
      p.vx+=(p.tx-p.x)*pull;
      p.vy+=(p.ty-p.y)*pull;
      p.vx*=.82;p.vy*=.82;
    } else {
      p.vy+=.004;
      if(p.y>innerHeight+20){p.y=-20;p.x=Math.random()*innerWidth}
    }
    p.x+=p.vx;p.y+=p.vy;
    p.tw+=.07;
    const shimmer=.78+.22*Math.sin(p.tw);
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*(gather>.55?1.18:1),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${210+Math.floor(Math.random()*40)},${115+Math.floor(Math.random()*100)},${Math.min(1,p.a*shimmer+(gather>.72?.18:0))})`;
    ctx.shadowBlur=(gather>.55?16:10);
    ctx.shadowColor="rgba(255,215,105,.9)";
    ctx.fill();
    if(gather>.72){
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(.45,p.r*.38),0,Math.PI*2);
      ctx.fillStyle="rgba(255,250,220,.88)";
      ctx.fill();
    }
  }
  ctx.shadowBlur=0;
  if(running) raf=requestAnimationFrame(animateParticles);
}

async function start(){
  reset(); running=true;
  nameEl.textContent=(nameInput.value.trim()||"Daniel");
  card.src="karten/"+cardSelect.value+".png";

  status("0.0 s – Feuerwerk startet");
  happy.style.opacity=1; glow.style.opacity=1;
  fireworks.volume=.30;
  try{await fireworks.play()}catch(e){status("Audio konnte nicht automatisch starten – erneut tippen.")}

  later(3000,()=>{
    if(!running)return;
    nameEl.className="show";
    status("3.0 s – Name erscheint");
  });

  later(10000,()=>{
    if(!running)return;
    nameEl.className="dissolve";
    makeParticles();
    animateParticles();
    status("10.0 s – Name zerfällt / dichter Partikelregen");
  });

  later(10500,async()=>{
    if(!running)return;
    party.volume=0;
    try{await party.play()}catch(e){}
    fadeAudio(fireworks,Math.min(.30,fireworks.volume),0,3300);
    fadeAudio(party,0,.28,3300);
    status("10.5 s – Sound-Crossfade zu feier.mp3");
  });

  later(14000,()=>{
    if(!running)return;
    gather=.25;
    status("14.0 s – Partikel beginnen sich zur Kartenfläche zu sammeln");
  });

  later(15300,()=>{if(running)gather=.58});

  later(16500,()=>{if(running)gather=1.35});

  later(17200,()=>{
    if(!running)return;
    // Noch keine harte Kontur: zuerst soll nur die gefüllte
    // Partikelkarte sichtbar sein.
    status("17.2 s – Kartenfläche ist vollständig mit Partikeln gefüllt");
  });

  later(18200,()=>{
    if(!running)return;
    // Erst jetzt wird die ganze gefüllte Fläche zum Lichtblitz.
    silhouette.className="bright";
    status("18.2 s – Gefüllte Partikelkarte blendet hell auf");
  });

  later(19000,async()=>{
    if(!running)return;
    card.className="show";
    silhouette.style.opacity=.18;
    fanfare.volume=.28;
    try{await fanfare.play()}catch(e){}
    status("19.0 s – Karte erscheint / FANFARE");
  });

  later(21000,()=>{
    if(!running)return;
    particles.forEach(p=>p.a*=.35);
    status("21.0 s – Karte bleibt stehen");
  });
}

document.getElementById("startBtn").addEventListener("click",start);
document.getElementById("resetBtn").addEventListener("click",reset);
reset();
</script>
</body>
</html>
