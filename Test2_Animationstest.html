<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Mystery Master – Animation Test 2.2</title>


<style>

/* =========================================================
   GRUNDLAYOUT
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


#stage {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   WALD
   ========================================================= */

#forest {

    position: absolute;

    inset: -3%;

    width: 106%;
    height: 106%;

    object-fit: cover;

    opacity: 1;

    transform: scale(1.02);

    transition:
        opacity 4s ease,
        transform 10s ease;
}


/* =========================================================
   DUNKELHEIT
   ========================================================= */

#darkness {

    position: absolute;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.28);

    opacity: 0;

    transition:
        opacity 4s ease;

    z-index: 10;
}


/* =========================================================
   VORHERSAGE
   ========================================================= */

#prediction-wrap {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10vw;

    z-index: 20;

    pointer-events: none;
}


#prediction {

    max-width: 92%;

    text-align: center;

    color:
        rgba(232, 211, 143, 0);

    font-size:
        clamp(28px, 6vw, 64px);

    line-height:
        1.28;

    letter-spacing:
        0.025em;

    text-shadow:
        0 0 7px rgba(232, 211, 143, 0.30),
        0 0 22px rgba(210, 185, 100, 0.18);

    filter:
        blur(12px);

    transform:
        scale(0.97);

    opacity:
        0;

    transition:
        opacity 2.5s ease,
        filter 2.8s ease,
        transform 3s ease;
}


/* =========================================================
   LEBENDIGE SCHRIFT
   ========================================================= */

#prediction.alive {

    animation:
        livingText 4.8s ease-in-out infinite alternate;
}


@keyframes livingText {

    0% {

        transform:
            translate3d(-1px, 0px, 0)
            scale(1.000);

        text-shadow:
            0 0 7px rgba(232, 211, 143, 0.26),
            0 0 20px rgba(210, 185, 100, 0.15);
    }

    50% {

        transform:
            translate3d(1px, -1px, 0)
            scale(1.007);

        text-shadow:
            0 0 11px rgba(232, 211, 143, 0.38),
            0 0 28px rgba(210, 185, 100, 0.21);
    }

    100% {

        transform:
            translate3d(0px, 1px, 0)
            scale(0.998);

        text-shadow:
            0 0 6px rgba(232, 211, 143, 0.23),
            0 0 18px rgba(210, 185, 100, 0.13);
    }
}


/* =========================================================
   EINZELNE BUCHSTABEN
   ========================================================= */

.magic-letter {

    display: inline-block;

    animation:
        letterBreath var(--delay) ease-in-out infinite alternate;

    opacity:
        var(--opacity);

    transform:
        translateY(0);
}


@keyframes letterBreath {

    0% {

        opacity:
            var(--opacity);

        transform:
            translateY(0px)
            scale(1);
    }

    50% {

        opacity:
            calc(var(--opacity) + 0.12);

        transform:
            translateY(-1px)
            scale(1.008);
    }

    100% {

        opacity:
            calc(var(--opacity) - 0.08);

        transform:
            translateY(1px)
            scale(0.996);
    }
}


/* =========================================================
   LESENEBEL
   ========================================================= */

#reading-fog {

    position: absolute;

    inset: -20%;

    z-index: 25;

    opacity: 0;

    pointer-events: none;

    overflow: hidden;

    filter:
        blur(18px);

    transition:
        opacity 3.5s ease;
}


.fog-cloud {

    position: absolute;

    width: 55%;
    height: 22%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(225, 225, 225, 0.15) 0%,
            rgba(210, 210, 210, 0.08) 28%,
            rgba(180, 180, 180, 0.03) 55%,
            rgba(180, 180, 180, 0) 75%
        );

    filter:
        blur(16px);

    opacity:
        0.75;
}


.fog-cloud.one {

    left: -20%;
    top: 35%;

    animation:
        fogMoveOne 11s ease-in-out infinite;
}


@keyframes fogMoveOne {

    0% {

        transform:
            translateX(0)
            translateY(0)
            scale(1);
    }

    50% {

        transform:
            translateX(55vw)
            translateY(-3vh)
            scale(1.15);
    }

    100% {

        transform:
            translateX(110vw)
            translateY(2vh)
            scale(1.05);
    }
}


.fog-cloud.two {

    right: -25%;
    top: 48%;

    width: 65%;
    height: 26%;

    opacity:
        0.55;

    animation:
        fogMoveTwo 14s ease-in-out infinite;
}


@keyframes fogMoveTwo {

    0% {

        transform:
            translateX(0)
            translateY(2vh)
            scale(1);
    }

    50% {

        transform:
            translateX(-48vw)
            translateY(-2vh)
            scale(1.18);
    }

    100% {

        transform:
            translateX(-105vw)
            translateY(3vh)
            scale(1.08);
    }
}


.fog-cloud.three {

    left: 15%;
    top: 62%;

    width: 70%;
    height: 18%;

    opacity:
        0.40;

    animation:
        fogMoveThree 16s ease-in-out infinite;
}


@keyframes fogMoveThree {

    0% {

        transform:
            translateX(-10vw)
            translateY(0)
            scale(1);
    }

    50% {

        transform:
            translateX(15vw)
            translateY(-4vh)
            scale(1.20);
    }

    100% {

        transform:
            translateX(-8vw)
            translateY(2vh)
            scale(1.05);
    }
}


/* =========================================================
   FINALER NEBEL
   ========================================================= */

#fog-front {

    position: absolute;

    inset: -5%;

    width: 110%;
    height: 110%;

    object-fit: cover;

    z-index: 30;

    opacity: 0;

    filter:
        blur(1px);

    transform:
        scale(1.08);

    mix-blend-mode:
        screen;

    pointer-events:
        none;

    transition:
        opacity 5s ease,
        transform 9s ease;
}


/* =========================================================
   FINALER DUNST
   ========================================================= */

#mist {

    position: absolute;

    inset: -10%;

    z-index: 27;

    opacity: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 58%,
            rgba(235, 235, 235, 0.22) 0%,
            rgba(190, 190, 190, 0.12) 20%,
            rgba(100, 100, 100, 0.05) 43%,
            rgba(0, 0, 0, 0) 72%
        );

    filter:
        blur(25px);

    transform:
        scale(1);

    transition:
        opacity 5s ease,
        transform 9s ease;
}


/* =========================================================
   SILHOUETTE
   ========================================================= */

#silhouette {

    position: absolute;

    z-index: 40;

    left: 50%;
    top: 50%;

    width:
        min(42vw, 250px);

    aspect-ratio:
        2 / 3;

    transform:
        translate(-50%, -50%)
        scale(0.58);

    border-radius:
        10px;

    background:
        rgba(5, 5, 5, 0.90);

    box-shadow:
        0 0 35px rgba(255, 255, 255, 0.07),
        0 0 100px rgba(255, 255, 255, 0.05);

    opacity:
        0;

    filter:
        blur(22px);

    transition:
        opacity 4s ease,
        filter 4s ease,
        transform 4.5s cubic-bezier(.2, .75, .2, 1);

    pointer-events:
        none;
}


#silhouette::after {

    content: "";

    position: absolute;

    inset: 5%;

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    border-radius:
        7px;
}


/* =========================================================
   KARTE
   ========================================================= */

#card {

    position: absolute;

    z-index: 50;

    left: 50%;
    top: 50%;

    width:
        min(42vw, 250px);

    aspect-ratio:
        2 / 3;

    object-fit:
        contain;

    transform:
        translate(-50%, -50%)
        scale(0.84);

    opacity:
        0;

    filter:
        blur(20px)
        brightness(0.50);

    transition:
        opacity 4s ease,
        filter 4.5s ease,
        transform 4.5s cubic-bezier(.2, .75, .2, 1);

    pointer-events:
        none;
}


/* =========================================================
   TEST-STEUERUNG
   ========================================================= */

#controls {

    position: fixed;

    z-index: 1000;

    left: 10px;
    right: 10px;

    bottom: 10px;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    justify-content: center;

    padding: 10px;

    border-radius: 12px;

    background:
        rgba(0, 0, 0, 0.72);

    backdrop-filter:
        blur(8px);
}


button,
select {

    appearance: none;

    border:
        1px solid #555;

    border-radius:
        7px;

    background:
        #111;

    color:
        #eee;

    padding:
        9px 10px;

    font:
        14px monospace;
}


button:active {

    transform:
        scale(0.97);
}


#status {

    width: 100%;

    color:
        #aaa;

    text-align:
        center;

    font:
        12px monospace;

    min-height:
        16px;
}


@media (max-width: 600px) {

    #controls {

        bottom: 5px;

        left: 5px;
        right: 5px;
    }


    #prediction-wrap {

        padding:
            9vw;
    }
}

</style>

</head>


<body>


<div id="stage">


    <!-- =====================================================
         WALD
         ===================================================== -->

    <img
        id="forest"
        src="wald.gif"
        alt=""
    >


    <!-- =====================================================
         DUNKELHEIT
         ===================================================== -->

    <div id="darkness"></div>


    <!-- =====================================================
         LESE-NEBEL
         ===================================================== -->

    <div id="reading-fog">

        <div class="fog-cloud one"></div>

        <div class="fog-cloud two"></div>

        <div class="fog-cloud three"></div>

    </div>


    <!-- =====================================================
         FINALER DUNST
         ===================================================== -->

    <div id="mist"></div>


    <!-- =====================================================
         VORHERSAGE
         ===================================================== -->

    <div id="prediction-wrap">

        <div id="prediction"></div>

    </div>


    <!-- =====================================================
         FINALER NEBEL
         ===================================================== -->

    <img
        id="fog-front"
        src="wald.gif"
        alt=""
    >


    <!-- =====================================================
         SILHOUETTE
         ===================================================== -->

    <div id="silhouette"></div>


    <!-- =====================================================
         KARTE
         ===================================================== -->

    <img
        id="card"
        src=""
        alt="Vorhersagekarte"
    >

</div>



<!-- =========================================================
     TESTSTEUERUNG
     ========================================================= -->

<div id="controls">


    <select id="caseSelect">

        <option value="nameDate">
            Name + Datum
        </option>

        <option value="dateOnly">
            Nur Datum
        </option>

        <option value="nameOnly">
            Nur Name
        </option>

        <option value="none">
            Weder Name noch Datum
        </option>

    </select>


    <select id="cardSelect">

        <option value="pik_7">
            Pik 7
        </option>

        <option value="herz_12">
            Herz Dame
        </option>

        <option value="karo_1">
            Karo Ass
        </option>

        <option value="kreuz_13">
            Kreuz König
        </option>

    </select>


    <button id="startBtn">
        FINALE TESTEN
    </button>


    <button id="resetBtn">
        RESET
    </button>


    <div id="status">
        Animationstest bereit.
    </div>

</div>



<script>

/* =========================================================
   ELEMENTE
   ========================================================= */

const forest =
    document.getElementById(
        "forest"
    );

const darkness =
    document.getElementById(
        "darkness"
    );

const readingFog =
    document.getElementById(
        "reading-fog"
    );

const mist =
    document.getElementById(
        "mist"
    );

const fogFront =
    document.getElementById(
        "fog-front"
    );

const prediction =
    document.getElementById(
        "prediction"
    );

const silhouette =
    document.getElementById(
        "silhouette"
    );

const card =
    document.getElementById(
        "card"
    );

const status =
    document.getElementById(
        "status"
    );

const caseSelect =
    document.getElementById(
        "caseSelect"
    );

const cardSelect =
    document.getElementById(
        "cardSelect"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );


/* =========================================================
   TIMER
   ========================================================= */

let timerIds = [];


function wait(ms) {

    return new Promise(
        resolve => {

            const id =
                setTimeout(
                    resolve,
                    ms
                );

            timerIds.push(id);

        }
    );
}


function clearTimers() {

    timerIds.forEach(
        clearTimeout
    );

    timerIds = [];
}


function setStatus(text) {

    status.textContent =
        text;
}


/* =========================================================
   TEXTE
   ========================================================= */

function predictionText(type) {

    switch (type) {

        case "nameDate":

            return "Max, du wirst den 23. Juni als Datum nennen.";

        case "dateOnly":

            return "Du wirst den 23. Juni als Datum nennen.";

        case "nameOnly":

            return "Max, dies ist deine persönliche Vorhersage.";

        default:

            return "Dies ist deine persönliche Vorhersage.";
    }
}


/* =========================================================
   TEXT IN EINZELNE BUCHSTABEN AUFTEILEN
   ========================================================= */

function createLivingText(text) {

    prediction.innerHTML = "";


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        if (
            char === " "
        ) {

            prediction.appendChild(
                document.createTextNode(" ")
            );

            continue;
        }


        const span =
            document.createElement(
                "span"
            );


        span.className =
            "magic-letter";


        span.textContent =
            char;


        /*
        Kleine Unterschiede zwischen
        den Buchstaben.

        Keine hektische Bewegung.
        */

        const delay =
            (3.2 + Math.random() * 2.5)
            .toFixed(2) +
            "s";


        const opacity =
            (
                0.84 +
                Math.random() * 0.16
            ).toFixed(2);


        span.style.setProperty(
            "--delay",
            delay
        );


        span.style.setProperty(
            "--opacity",
            opacity
        );


        prediction.appendChild(
            span
        );
    }
}


/* =========================================================
   KARTENPFAD
   ========================================================= */

function cardPath(value) {

    return "karten/" +
        value +
        ".png";
}


/* =========================================================
   RESET
   ========================================================= */

function resetAnimation() {

    clearTimers();


    forest.style.opacity =
        "1";

    forest.style.transform =
        "scale(1.02)";


    darkness.style.opacity =
        "0";


    readingFog.style.opacity =
        "0";


    mist.style.opacity =
        "0";

    mist.style.transform =
        "scale(1)";


    fogFront.style.opacity =
        "0";

    fogFront.style.transform =
        "scale(1.08)";


    prediction.classList.remove(
        "alive"
    );


    prediction.innerHTML =
        "";


    prediction.style.opacity =
        "0";


    prediction.style.color =
        "rgba(232, 211, 143, 0)";


    prediction.style.filter =
        "blur(12px)";


    prediction.style.transform =
        "scale(0.97)";


    silhouette.style.opacity =
        "0";


    silhouette.style.filter =
        "blur(22px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.58)";


    card.style.opacity =
        "0";


    card.style.filter =
        "blur(20px) brightness(0.50)";


    card.style.transform =
        "translate(-50%, -50%) scale(0.84)";


    card.src =
        "";


    setStatus(
        "Animationstest bereit."
    );
}


/* =========================================================
   HAUPTANIMATION
   ========================================================= */

async function startAnimation() {

    clearTimers();

    resetAnimation();


    const type =
        caseSelect.value;


    const selectedCard =
        cardSelect.value;


    card.src =
        cardPath(
            selectedCard
        );


    /* =====================================================
       0 SEKUNDEN
       ===================================================== */

    setStatus(
        "0.0 s – Wald erwacht ..."
    );


    await wait(1000);


    /* =====================================================
       1 SEKUNDE
       TEXT
       ===================================================== */

    setStatus(
        "1.0 s – Vorhersage erscheint ..."
    );


    createLivingText(
        predictionText(type)
    );


    prediction.style.color =
        "rgba(232, 211, 143, 1)";


    prediction.style.opacity =
        "1";


    prediction.style.filter =
        "blur(0px)";


    prediction.style.transform =
        "scale(1)";


    await wait(1500);


    /* =====================================================
       2.5 SEKUNDEN
       LEBENDIGE SCHRIFT
       ===================================================== */

    setStatus(
        "2.5 s – Schrift beginnt zu atmen ..."
    );


    prediction.classList.add(
        "alive"
    );


    await wait(500);


    /* =====================================================
       3 SEKUNDEN
       LESE-NEBEL
       ===================================================== */

    setStatus(
        "3.0 s – Nebel zieht durch die Schrift ..."
    );


    readingFog.style.opacity =
        "1";


    /*
    Jetzt bleiben rund 5 Sekunden
    zum Lesen.
    */

    await wait(4000);


    /* =====================================================
       7 SEKUNDEN
       NEBEL WIRD STÄRKER
       ===================================================== */

    setStatus(
        "7.0 s – Der Nebel wird dichter ..."
    );


    prediction.classList.remove(
        "alive"
    );


    /*
    Schrift beginnt langsam
    zu verschwinden.
    */

    prediction.style.opacity =
        "0.25";


    prediction.style.filter =
        "blur(10px)";


    readingFog.style.opacity =
        "0.55";


    forest.style.opacity =
        "0.42";


    forest.style.transform =
        "scale(1.10)";


    darkness.style.opacity =
        "0.48";


    mist.style.opacity =
        "0.82";


    mist.style.transform =
        "scale(1.12)";


    fogFront.style.opacity =
        "0.48";


    fogFront.style.transform =
        "scale(1.15)";


    await wait(1000);


    /* =====================================================
       8 SEKUNDEN
       TEXT IST WEG
       ===================================================== */

    setStatus(
        "8.0 s – Die Vorhersage verschwindet ..."
    );


    /*
    WICHTIG:

    Nicht 0.15.
    Nicht 0.05.

    Wirklich vollständig weg.
    */

    prediction.style.opacity =
        "0";


    prediction.style.filter =
        "blur(18px)";


    readingFog.style.opacity =
        "0.75";


    forest.style.opacity =
        "0.24";


    darkness.style.opacity =
        "0.58";


    mist.style.opacity =
        "1";


    fogFront.style.opacity =
        "0.72";


    fogFront.style.transform =
        "scale(1.20)";


    /* =====================================================
       8–11 SEKUNDEN
       NUR NEBEL

       Bewusste Pause.
       ===================================================== */

    await wait(3000);


    /* =====================================================
       11 SEKUNDEN
       ERSTE SILHOUETTE
       ===================================================== */

    setStatus(
        "11.0 s – Etwas zeichnet sich ab ..."
    );


    silhouette.style.opacity =
        "0.25";


    silhouette.style.filter =
        "blur(18px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.66)";


    await wait(1500);


    /* =====================================================
       12.5 SEKUNDEN
       SILHOUETTE WIRD ERKENNBAR
       ===================================================== */

    setStatus(
        "12.5 s – Die Form wird deutlicher ..."
    );


    silhouette.style.opacity =
        "0.58";


    silhouette.style.filter =
        "blur(9px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.82)";


    await wait(1000);


    /* =====================================================
       13.5 SEKUNDEN
       SILHOUETTE FAST DA
       ===================================================== */

    setStatus(
        "13.5 s – Die Karte zeichnet sich ab ..."
    );


    silhouette.style.opacity =
        "0.82";


    silhouette.style.filter =
        "blur(5px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.94)";


    /*
    Noch einmal dichter Nebel.
    */

    fogFront.style.opacity =
        "0.86";


    mist.style.opacity =
        "1";


    await wait(1500);


    /* =====================================================
       15 SEKUNDEN
       SILHOUETTE → KARTE
       ===================================================== */

    setStatus(
        "15.0 s – Die Vorhersage wird sichtbar ..."
    );


    /*
    Silhouette verschmilzt mit
    der Karte.
    */

    silhouette.style.opacity =
        "0.25";


    silhouette.style.filter =
        "blur(10px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(1.0)";


    card.style.opacity =
        "0.25";


    card.style.filter =
        "blur(15px) brightness(0.55)";


    card.style.transform =
        "translate(-50%, -50%) scale(0.90)";


    await wait(1500);


    /* =====================================================
       16.5 SEKUNDEN
       KARTE WIRD SICHTBAR
       ===================================================== */

    setStatus(
        "16.5 s – Die Karte erscheint ..."
    );


    card.style.opacity =
        "0.70";


    card.style.filter =
        "blur(6px) brightness(0.80)";


    card.style.transform =
        "translate(-50%, -50%) scale(0.96)";


    await wait(1500);


    /* =====================================================
       18 SEKUNDEN
       KARTE KLAR
       ===================================================== */

    setStatus(
        "18.0 s – Karte vollständig sichtbar."
    );


    card.style.opacity =
        "1";


    card.style.filter =
        "blur(0px) brightness(1)";


    card.style.transform =
        "translate(-50%, -50%) scale(1)";


    /*
    Nebel bleibt noch leicht davor.
    */

    fogFront.style.opacity =
        "0.36";


    forest.style.opacity =
        "0.10";


    darkness.style.opacity =
        "0.70";


    await wait(3000);


    setStatus(
        "FERTIG – Vorhersagekarte steht."
    );
}


/* =========================================================
   BUTTONS
   ========================================================= */

startBtn.addEventListener(
    "click",
    startAnimation
);


resetBtn.addEventListener(
    "click",
    resetAnimation
);


/* =========================================================
   START
   ========================================================= */

resetAnimation();

</script>

</body>

</html>
