<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Mystery Master – Animation Test2</title>


<style>

/* =========================================================
   GRUNDLAYOUT
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================================
   SHOW-BÜHNE
   ========================================================= */

#stage {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   WALD / NEBEL GIF
   ========================================================= */

#forest {

    position: absolute;

    inset: -3%;

    width: 106%;
    height: 106%;

    object-fit: cover;

    opacity: 1;

    transform: scale(1.02);

    transition:
        opacity 3s ease,
        transform 10s ease;
}


/* =========================================================
   DUNKELHEIT
   ========================================================= */

#darkness {

    position: absolute;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.28);

    opacity: 0;

    transition:
        opacity 3s ease;
}


/* =========================================================
   VORHERSAGE-TEXT
   ========================================================= */

#prediction-wrap {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10vw;

    z-index: 20;

    pointer-events: none;
}


#prediction {

    max-width: 92%;

    text-align: center;

    color:
        rgba(232, 211, 143, 0);

    font-size:
        clamp(28px, 6vw, 64px);

    line-height:
        1.28;

    letter-spacing:
        0.025em;

    text-shadow:
        0 0 7px rgba(232, 211, 143, 0.30),
        0 0 22px rgba(210, 185, 100, 0.18);

    filter:
        blur(12px);

    transform:
        scale(0.97);

    opacity:
        0;

    transition:
        opacity 2.3s ease,
        filter 2.5s ease,
        transform 3s ease;
}


/* =========================================================
   LEBENDIGE SCHRIFT
   ========================================================= */

#prediction.alive {

    animation:
        livingText 4.2s ease-in-out infinite alternate;
}


@keyframes livingText {

    0% {

        transform:
            translate3d(-1px, 0px, 0)
            scale(1.000);

        text-shadow:
            0 0 7px rgba(232, 211, 143, 0.28),
            0 0 20px rgba(210, 185, 100, 0.16);
    }


    50% {

        transform:
            translate3d(1px, -1px, 0)
            scale(1.006);

        text-shadow:
            0 0 10px rgba(232, 211, 143, 0.34),
            0 0 25px rgba(210, 185, 100, 0.20);
    }


    100% {

        transform:
            translate3d(0px, 1px, 0)
            scale(0.998);

        text-shadow:
            0 0 6px rgba(232, 211, 143, 0.25),
            0 0 18px rgba(210, 185, 100, 0.14);
    }
}


/* =========================================================
   DEZENTER NEBELSCHLEIER

   Dieser Effekt beginnt bereits während
   der Zuschauer den Text liest.

   Er liegt ÜBER der Schrift.

   Noch sehr schwach.
   ========================================================= */

#reading-fog {

    position: absolute;

    inset: -20%;

    z-index: 25;

    opacity: 0;

    pointer-events: none;

    overflow: hidden;

    filter:
        blur(18px);

    transition:
        opacity 3s ease;
}


/* ---------------------------------------------------------
   Einzelne weiche Nebelfelder
   --------------------------------------------------------- */

.fog-cloud {

    position: absolute;

    width: 55%;
    height: 22%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(225, 225, 225, 0.14) 0%,
            rgba(210, 210, 210, 0.08) 28%,
            rgba(180, 180, 180, 0.03) 55%,
            rgba(180, 180, 180, 0) 75%
        );

    filter:
        blur(16px);

    opacity:
        0.75;
}


/* ---------------------------------------------------------
   Nebelbewegung 1
   --------------------------------------------------------- */

.fog-cloud.one {

    left: -20%;
    top: 35%;

    animation:
        fogMoveOne 11s ease-in-out infinite;
}


@keyframes fogMoveOne {

    0% {

        transform:
            translateX(0)
            translateY(0)
            scale(1);
    }

    50% {

        transform:
            translateX(55vw)
            translateY(-3vh)
            scale(1.15);
    }

    100% {

        transform:
            translateX(110vw)
            translateY(2vh)
            scale(1.05);
    }
}


/* ---------------------------------------------------------
   Nebelbewegung 2
   --------------------------------------------------------- */

.fog-cloud.two {

    right: -25%;
    top: 48%;

    width: 65%;
    height: 26%;

    opacity:
        0.55;

    animation:
        fogMoveTwo 14s ease-in-out infinite;
}


@keyframes fogMoveTwo {

    0% {

        transform:
            translateX(0)
            translateY(2vh)
            scale(1);
    }

    50% {

        transform:
            translateX(-48vw)
            translateY(-2vh)
            scale(1.18);
    }

    100% {

        transform:
            translateX(-105vw)
            translateY(3vh)
            scale(1.08);
    }
}


/* ---------------------------------------------------------
   Nebelbewegung 3
   --------------------------------------------------------- */

.fog-cloud.three {

    left: 15%;
    top: 62%;

    width: 70%;
    height: 18%;

    opacity:
        0.40;

    animation:
        fogMoveThree 16s ease-in-out infinite;
}


@keyframes fogMoveThree {

    0% {

        transform:
            translateX(-10vw)
            translateY(0)
            scale(1);
    }

    50% {

        transform:
            translateX(15vw)
            translateY(-4vh)
            scale(1.20);
    }

    100% {

        transform:
            translateX(-8vw)
            translateY(2vh)
            scale(1.05);
    }
}


/* =========================================================
   FINALER VORDERGRUND-NEBEL

   Dieser kommt erst ab Sekunde 7.
   ========================================================= */

#fog-front {

    position: absolute;

    inset: -5%;

    width: 110%;
    height: 110%;

    object-fit: cover;

    z-index: 30;

    opacity: 0;

    filter:
        blur(1px);

    transform:
        scale(1.08);

    mix-blend-mode:
        screen;

    pointer-events:
        none;

    transition:
        opacity 4s ease,
        transform 8s ease;
}


/* =========================================================
   ZUSÄTZLICHER FINAL-DUNST
   ========================================================= */

#mist {

    position: absolute;

    inset: -10%;

    z-index: 26;

    opacity: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 58%,
            rgba(235, 235, 235, 0.20) 0%,
            rgba(190, 190, 190, 0.10) 20%,
            rgba(100, 100, 100, 0.04) 43%,
            rgba(0, 0, 0, 0) 70%
        );

    filter:
        blur(22px);

    transform:
        scale(1);

    transition:
        opacity 4s ease,
        transform 8s ease;
}


/* =========================================================
   KARTEN-SILHOUETTE
   ========================================================= */

#silhouette {

    position: absolute;

    z-index: 40;

    left: 50%;
    top: 50%;

    width:
        min(42vw, 250px);

    aspect-ratio:
        2 / 3;

    transform:
        translate(-50%, -50%)
        scale(0.62);

    border-radius:
        10px;

    background:
        rgba(5, 5, 5, 0.88);

    box-shadow:
        0 0 35px rgba(255, 255, 255, 0.07),
        0 0 90px rgba(255, 255, 255, 0.04);

    opacity:
        0;

    filter:
        blur(20px);

    transition:
        opacity 3.5s ease,
        filter 3.5s ease,
        transform 4s cubic-bezier(.2, .75, .2, 1);

    pointer-events:
        none;
}


#silhouette::after {

    content: "";

    position: absolute;

    inset: 5%;

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    border-radius:
        7px;
}


/* =========================================================
   ECHTE KARTE
   ========================================================= */

#card {

    position: absolute;

    z-index: 50;

    left: 50%;
    top: 50%;

    width:
        min(42vw, 250px);

    aspect-ratio:
        2 / 3;

    object-fit:
        contain;

    transform:
        translate(-50%, -50%)
        scale(0.88);

    opacity:
        0;

    filter:
        blur(14px)
        brightness(0.70);

    transition:
        opacity 2.8s ease,
        filter 3s ease,
        transform 3s cubic-bezier(.2, .75, .2, 1);

    pointer-events:
        none;
}


/* =========================================================
   TEST-STEUERUNG
   ========================================================= */

#controls {

    position: fixed;

    z-index: 1000;

    left: 10px;
    right: 10px;

    bottom: 10px;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    justify-content: center;

    padding: 10px;

    border-radius: 12px;

    background:
        rgba(0, 0, 0, 0.72);

    backdrop-filter:
        blur(8px);
}


button,
select {

    appearance: none;

    border:
        1px solid #555;

    border-radius:
        7px;

    background:
        #111;

    color:
        #eee;

    padding:
        9px 10px;

    font:
        14px monospace;
}


button:active {

    transform:
        scale(0.97);
}


#status {

    width: 100%;

    color:
        #aaa;

    text-align:
        center;

    font:
        12px monospace;

    min-height:
        16px;
}


/* =========================================================
   HANDY
   ========================================================= */

@media (max-width: 600px) {

    #controls {

        bottom: 5px;

        left: 5px;
        right: 5px;
    }


    #prediction-wrap {

        padding:
            9vw;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     SHOW
     ======================================================= -->

<div id="stage">


    <!--
    RICHTIGER DATEINAME:
    wald.gif
    -->

    <img
        id="forest"
        src="wald.gif"
        alt=""
    >


    <!-- Dunkelheit -->

    <div id="darkness"></div>


    <!--
    Dezenter Nebel für die Lesephase.
    Dieser liegt ÜBER der Schrift.
    -->

    <div id="reading-fog">

        <div class="fog-cloud one"></div>

        <div class="fog-cloud two"></div>

        <div class="fog-cloud three"></div>

    </div>


    <!-- zusätzlicher Final-Dunst -->

    <div id="mist"></div>


    <!-- Vorhersage -->

    <div id="prediction-wrap">

        <div id="prediction"></div>

    </div>


    <!--
    Finaler Nebel liegt über der Schrift.
    -->

    <img
        id="fog-front"
        src="wald.gif"
        alt=""
    >


    <!-- Kartensilhouette -->

    <div id="silhouette"></div>


    <!-- tatsächliche Karte -->

    <img
        id="card"
        src=""
        alt="Vorhersagekarte"
    >

</div>



<!-- =======================================================
     TEST-STEUERUNG

     KEIN MIKROFON
     KEINE SPRACHERKENNUNG
     ======================================================= -->

<div id="controls">


    <select id="caseSelect">

        <option value="nameDate">
            Name + Datum
        </option>

        <option value="dateOnly">
            Nur Datum
        </option>

        <option value="nameOnly">
            Nur Name
        </option>

        <option value="none">
            Weder Name noch Datum
        </option>

    </select>


    <select id="cardSelect">

        <option value="pik_7">
            Pik 7
        </option>

        <option value="herz_12">
            Herz Dame
        </option>

        <option value="karo_1">
            Karo Ass
        </option>

        <option value="kreuz_13">
            Kreuz König
        </option>

    </select>


    <button id="startBtn">
        FINALE TESTEN
    </button>


    <button id="resetBtn">
        RESET
    </button>


    <div id="status">
        Animationstest bereit.
    </div>

</div>



<script>


/* =========================================================
   ELEMENTE
   ========================================================= */

const forest =
    document.getElementById(
        "forest"
    );


const darkness =
    document.getElementById(
        "darkness"
    );


const readingFog =
    document.getElementById(
        "reading-fog"
    );


const mist =
    document.getElementById(
        "mist"
    );


const fogFront =
    document.getElementById(
        "fog-front"
    );


const prediction =
    document.getElementById(
        "prediction"
    );


const silhouette =
    document.getElementById(
        "silhouette"
    );


const card =
    document.getElementById(
        "card"
    );


const status =
    document.getElementById(
        "status"
    );


const caseSelect =
    document.getElementById(
        "caseSelect"
    );


const cardSelect =
    document.getElementById(
        "cardSelect"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


/* =========================================================
   TIMER
   ========================================================= */

let timerIds = [];


function wait(ms) {

    return new Promise(
        resolve => {

            const id =
                setTimeout(
                    resolve,
                    ms
                );

            timerIds.push(id);

        }
    );
}


function clearTimers() {

    timerIds.forEach(
        clearTimeout
    );

    timerIds = [];
}


function setStatus(text) {

    status.textContent =
        text;
}


/* =========================================================
   TEST-TEXTE
   ========================================================= */

function predictionText(type) {

    switch (type) {

        case "nameDate":

            return "Max, du wirst den 23. Juni als Datum nennen.";

        case "dateOnly":

            return "Du wirst den 23. Juni als Datum nennen.";

        case "nameOnly":

            return "Max, dies ist deine persönliche Vorhersage.";

        default:

            return "Dies ist deine persönliche Vorhersage.";
    }
}


/* =========================================================
   KARTENPFAD
   ========================================================= */

function cardPath(value) {

    return "karten/" + value + ".png";
}


/* =========================================================
   RESET
   ========================================================= */

function resetAnimation() {

    clearTimers();


    forest.style.opacity =
        "1";

    forest.style.transform =
        "scale(1.02)";


    darkness.style.opacity =
        "0";


    readingFog.style.opacity =
        "0";


    mist.style.opacity =
        "0";

    mist.style.transform =
        "scale(1)";


    fogFront.style.opacity =
        "0";

    fogFront.style.transform =
        "scale(1.08)";


    prediction.classList.remove(
        "alive"
    );

    prediction.style.opacity =
        "0";

    prediction.style.color =
        "rgba(232, 211, 143, 0)";

    prediction.style.filter =
        "blur(12px)";

    prediction.style.transform =
        "scale(0.97)";


    silhouette.style.opacity =
        "0";

    silhouette.style.filter =
        "blur(20px)";

    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.62)";


    card.style.opacity =
        "0";

    card.style.filter =
        "blur(14px) brightness(0.70)";

    card.style.transform =
        "translate(-50%, -50%) scale(0.88)";

    card.src =
        "";


    setStatus(
        "Animationstest bereit."
    );
}


/* =========================================================
   HAUPTANIMATION

   ZEITPLAN:

   0.0    Wald
   1.0    Text beginnt
   2.5    Text lebt
   3.0    dezenter Nebel beginnt
   7.0    finaler Nebel
   8.0    Silhouette
   9.0    Silhouette deutlicher
   10.0   Karte
   ========================================================= */

async function startAnimation() {

    clearTimers();

    resetAnimation();


    const type =
        caseSelect.value;


    const selectedCard =
        cardSelect.value;


    /*
    Karte laden.

    Sie bleibt vollständig unsichtbar.
    */

    card.src =
        cardPath(
            selectedCard
        );


    /* =====================================================
       SEKUNDE 0
       ===================================================== */

    setStatus(
        "0.0 s – Wald erwacht ..."
    );


    await wait(1000);


    /* =====================================================
       SEKUNDE 1
       TEXT BEGINNT
       ===================================================== */

    setStatus(
        "1.0 s – Vorhersage erscheint ..."
    );


    prediction.textContent =
        predictionText(
            type
        );


    prediction.style.color =
        "rgba(232, 211, 143, 1)";


    prediction.style.opacity =
        "1";


    prediction.style.filter =
        "blur(0px)";


    prediction.style.transform =
        "scale(1)";


    await wait(1500);


    /* =====================================================
       SEKUNDE 2.5
       TEXT BEGINNT ZU LEBEN
       ===================================================== */

    setStatus(
        "2.5 s – Schrift lebt ..."
    );


    prediction.classList.add(
        "alive"
    );


    await wait(500);


    /* =====================================================
       SEKUNDE 3
       DEZENTER NEBELSCHLEIER
       ===================================================== */

    setStatus(
        "3.0 s – Nebel zieht langsam durch die Schrift ..."
    );


    readingFog.style.opacity =
        "1";


    /*
    Der Schleier ist absichtlich schwach.
    Der Zuschauer soll die Schrift weiterhin
    problemlos lesen können.
    */

    await wait(4000);


    /* =====================================================
       SEKUNDE 7
       FINALER NEBEL
       ===================================================== */

    setStatus(
        "7.0 s – Der Nebel verdichtet sich ..."
    );


    prediction.classList.remove(
        "alive"
    );


    prediction.style.opacity =
        "0.15";


    prediction.style.filter =
        "blur(8px)";


    readingFog.style.opacity =
        "0.35";


    forest.style.opacity =
        "0.40";


    forest.style.transform =
        "scale(1.08)";


    darkness.style.opacity =
        "0.45";


    mist.style.opacity =
        "0.95";


    mist.style.transform =
        "scale(1.12)";


    fogFront.style.opacity =
        "0.62";


    fogFront.style.transform =
        "scale(1.17)";


    await wait(1000);


    /* =====================================================
       SEKUNDE 8
       SILHOUETTE
       ===================================================== */

    setStatus(
        "8.0 s – Etwas zeichnet sich im Nebel ab ..."
    );


    silhouette.style.opacity =
        "0.42";


    silhouette.style.filter =
        "blur(13px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.76)";


    await wait(1000);


    /* =====================================================
       SEKUNDE 9
       SILHOUETTE WIRD DEUTLICHER
       ===================================================== */

    setStatus(
        "9.0 s – Die Form wird erkennbar ..."
    );


    silhouette.style.opacity =
        "0.78";


    silhouette.style.filter =
        "blur(7px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.92)";


    await wait(1000);


    /* =====================================================
       SEKUNDE 10
       KARTE
       ===================================================== */

    setStatus(
        "10.0 s – Die Vorhersage wird sichtbar ..."
    );


    silhouette.style.opacity =
        "0.12";


    silhouette.style.filter =
        "blur(5px)";


    silhouette.style.transform =
        "translate(-50%, -50%) scale(0.98)";


    card.style.opacity =
        "0.65";


    card.style.filter =
        "blur(6px) brightness(0.88)";


    card.style.transform =
        "translate(-50%, -50%) scale(0.96)";


    await wait(1500);


    /* =====================================================
       KARTE WIRD SCHARF
       ===================================================== */

    card.style.opacity =
        "1";


    card.style.filter =
        "blur(0px) brightness(1)";


    card.style.transform =
        "translate(-50%, -50%) scale(1)";


    fogFront.style.opacity =
        "0.30";


    forest.style.opacity =
        "0.12";


    darkness.style.opacity =
        "0.65";


    /* =====================================================
       RUHE
       ===================================================== */

    await wait(2500);


    setStatus(
        "FERTIG – Die Vorhersage steht."
    );
}


/* =========================================================
   BUTTONS
   ========================================================= */

startBtn.addEventListener(
    "click",
    startAnimation
);


resetBtn.addEventListener(
    "click",
    resetAnimation
);


/* =========================================================
   STARTZUSTAND
   ========================================================= */

resetAnimation();

</script>

</body>

</html>
