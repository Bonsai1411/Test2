<script>

/* =====================================================
   ÄNDERUNGSSTAND SPRACHLABOR 4.3

   Bisher bestätigte Änderungen:
   - „DIESER STELLE“ bleibt als alternativer Starttrigger erhalten.
   - „UNBEKANNT“ bleibt zusätzlich zu „VERDECKT“ ein Abschluss-Trigger.

   Neuer Datumstest in 4.3:
   - „ERST“ / „DANN“ werden wieder verworfen.
   - Das Geburtsdatum wird direkt aus der ersten Nennung
     unmittelbar nach „DEIN DATUM“ gelesen.
   - Unterstützt werden u. a. Schreibweisen wie:
       03.02
       2.01
       erste zweite
   - Das Datum wird nur übernommen, wenn zwei getrennte,
     gültige Werte erkannt werden:
       erster Wert = Tag (1–31)
       zweiter Wert = Monat (1–12)
   - Ein einzelner zusammengezogener Wert wie „11“ wird
     NICHT geraten oder künstlich in 1 / 1 zerlegt.
   ===================================================== */


/* =====================================================
   GRUNDVARIABLEN
   ===================================================== */

let phase = 0;

let kartenFarbe = "";

let kartenWert = 0;

let zuschauerName = "";

let geburtsTag = null;

let geburtsMonat = null;

let geburtsDatum = "";

let istGeburtstag = false;

let startDurchZusammenAnzahl = 0;
let startDurchDieserStelleAnzahl = 0;
let startDurchBeideAnzahl = 0;

let diagnoseSitzung = 0, diagnoseStarts = 0, diagnoseAudioStarts = 0;
let diagnoseSpeechStarts = 0, diagnoseSpeechEnds = 0, diagnoseAudioEnds = 0;
let diagnoseResults = 0, diagnoseErrors = 0, diagnoseEnds = 0, diagnoseLeereEnds = 0;
let diagnoseAktuelleSitzungHatResultat = false;
let diagnoseAktuelleSitzungHatSpeech = false;

let testStartZeit = null;
let testBeendet = false;
let erkannteTexte = [];
let codewortEreignisse = [];
let sitzungsEreignisse = [];

function seitTestStart() {
    if (testStartZeit === null) return 0;
    return (performance.now() - testStartZeit) / 1000;
}

function fmtSek(wert) {
    return (Math.round(wert * 100) / 100).toFixed(2) + " s";
}

function speichereSitzungsEvent(name) {
    sitzungsEreignisse.push({
        zeit: seitTestStart(),
        name: name,
        sitzung: diagnoseSitzung
    });
}

function speichereCodewort(name) {
    const jetzt = seitTestStart();
    const letztes = codewortEreignisse[codewortEreignisse.length - 1];

    if (letztes && letztes.name === name && Math.abs(jetzt - letztes.zeit) < 0.30) {
        return;
    }

    codewortEreignisse.push({
        zeit: jetzt,
        name: name,
        phase: phase
    });
}

function timingCodewoerter(text) {
    const t = text.toLowerCase();

    if (t.includes("dieser stelle") || t.includes("an dieser stelle")) speichereCodewort("DIESER STELLE");
    if (t.includes("zusammen")) speichereCodewort("ZUSAMMEN");

    if (t.includes("passiert")) speichereCodewort("FARBE: PASSIERT / PIK");
    if (t.includes("geschehen")) speichereCodewort("FARBE: GESCHEHEN / HERZ");
    if (t.includes("gewesen")) speichereCodewort("FARBE: GEWESEN / KREUZ");
    if (t.includes("gehabt")) speichereCodewort("FARBE: GEHABT / KARO");

    if (/\bein\s*mal\b/.test(t) || /\beinmal\b/.test(t)) speichereCodewort("WERT: EINMAL (+1)");
    if (/\bzwei\s*mal\b/.test(t) || /\bzweimal\b/.test(t)) speichereCodewort("WERT: ZWEIMAL (+2)");
    if (/\bdrei\s*mal\b/.test(t) || /\bdreimal\b/.test(t)) speichereCodewort("WERT: DREIMAL (+3)");
    if (/\bvier\s*mal\b/.test(t) || /\bviermal\b/.test(t)) speichereCodewort("WERT: VIERMAL (+4)");

    if (/\bhänden\b/.test(t) || /\bhaenden\b/.test(t)) {
        speichereCodewort("WERT: HÄNDEN (+10)");
    } else if (/\bhand\b/.test(t)) {
        speichereCodewort("WERT: HAND (+5)");
    }

    if (
        t.includes("reihenfolge") ||
        (t.includes("karten") && t.includes("deck") && t.includes("bestimmt"))
    ) {
        speichereCodewort("REIHENFOLGE / WERT ENDE");
    }

    if (t.includes("dein datum")) speichereCodewort("DEIN DATUM");
    if (t.includes("heute")) speichereCodewort("HEUTE");
    if (t.includes("verdeckt") || t.includes("unbekannt")) speichereCodewort("VERDECKT / UNBEKANNT");
}

function erstelleTestAuswertung() {
    logToConsole("<br>==================================================");
    logToConsole("🧾 TESTAUSWERTUNG");
    logToConsole("==================================================");
    logToConsole("GESAMTDAUER: " + fmtSek(seitTestStart()));

    logToConsole("<br>--- ALLE ERKANNTEN TEXTE ---");
    if (erkannteTexte.length === 0) {
        logToConsole("(kein Textresultat)");
    } else {
        for (const e of erkannteTexte) {
            logToConsole(
                fmtSek(e.zeit) +
                " | Sitzung " + e.sitzung +
                " | „" + e.text + "“"
            );
        }
    }

    logToConsole("<br>--- CODEWORT-TIMING ---");
    if (codewortEreignisse.length === 0) {
        logToConsole("(keine Codewörter erkannt)");
    } else {
        let vorher = null;
        for (const e of codewortEreignisse) {
            const abstand = vorher === null ? "START" : "+" + fmtSek(e.zeit - vorher);
            logToConsole(fmtSek(e.zeit) + " | " + e.name + " | Abstand: " + abstand);
            vorher = e.zeit;
        }
    }

    logToConsole("<br>--- SITZUNGSGRENZEN ---");
    for (const e of sitzungsEreignisse) {
        logToConsole(fmtSek(e.zeit) + " | Sitzung " + e.sitzung + " | " + e.name);
    }

    logToConsole("<br>--- PROGRAMMSTATUS ---");
    logToConsole("PHASE: " + phase);
    logToConsole("FARBE: " + (kartenFarbe || "(nicht erkannt)"));
    logToConsole("WERT: " + kartenWert);
    logToConsole("NAME: " + (zuschauerName || "(nicht erkannt)"));
    logToConsole("DATUM: " + (geburtsDatum || "(nicht erkannt)"));
    logToConsole("CODE KOMPLETT: " + (phase >= 4 ? "JA" : "NEIN"));
    logToConsole("==================================================");
}

function beendeTestManuell() {
    if (testBeendet) return;
    testBeendet = true;

    try {
        recognition.stop();
    } catch (e) {}

    setTimeout(erstelleTestAuswertung, 300);
}

function starteNeuenTest() {
    location.reload();
}


function diagnoseZeit() {
    const d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" +
           String(d.getMinutes()).padStart(2,"0") + ":" +
           String(d.getSeconds()).padStart(2,"0") + "." +
           String(d.getMilliseconds()).padStart(3,"0");
}
function diagnoseLog(name, extra="") {
    logToConsole("🧪 [" + diagnoseZeit() + "] SITZUNG " + diagnoseSitzung +
                 " | " + name + (extra ? " | " + extra : ""));
}
function diagnoseStatistik() {
    logToConsole("📈 STARTS: " + diagnoseStarts +
        " | AUDIO: " + diagnoseAudioStarts +
        " | SPEECH: " + diagnoseSpeechStarts +
        " | RESULTATE: " + diagnoseResults +
        " | ERRORS: " + diagnoseErrors +
        " | ENDS: " + diagnoseEnds +
        " | OHNE RESULTAT: " + diagnoseLeereEnds);
}



/* =====================================================
   SPRACHPUFFER
   ===================================================== */

let phase1Text = "";

let phase2Text = "";

let phase3Text = "";


let verarbeitetesResultat = 0;

let benutzerScrollt = false;


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const consoleDiv =
    document.getElementById(
        "debug-console"
    );


/* =====================================================
   SCROLLVERHALTEN
   ===================================================== */

consoleDiv.addEventListener(
    "scroll",
    () => {

        if (
            consoleDiv.scrollHeight -
            consoleDiv.scrollTop >
            consoleDiv.clientHeight + 30
        ) {

            benutzerScrollt = true;

        } else {

            benutzerScrollt = false;
        }

    }
);


/* =====================================================
   KONSOLE
   ===================================================== */

function logToConsole(text) {

    if (consoleDiv) {

        consoleDiv.innerHTML +=
            "<br>" + text;


        if (!benutzerScrollt) {

            consoleDiv.scrollTop =
                consoleDiv.scrollHeight;
        }
    }
}


/* =====================================================
   DEUTSCHE ZAHLEN
   ===================================================== */

const deutscheZahlen = {

    "null": 0,

    "eins": 1,
    "ein": 1,

    "zwei": 2,

    "drei": 3,

    "vier": 4,

    "fünf": 5,
    "funf": 5,

    "sechs": 6,

    "sieben": 7,

    "acht": 8,

    "neun": 9,

    "zehn": 10,

    "elf": 11,

    "zwölf": 12,
    "zwolf": 12,

    "dreizehn": 13,

    "vierzehn": 14,

    "fünfzehn": 15,
    "funfzehn": 15,

    "sechzehn": 16,

    "siebzehn": 17,

    "achtzehn": 18,

    "neunzehn": 19,

    "zwanzig": 20,

    "einundzwanzig": 21,

    "zweiundzwanzig": 22,

    "dreiundzwanzig": 23,

    "vierundzwanzig": 24,

    "fünfundzwanzig": 25,
    "funfundzwanzig": 25,

    "sechsundzwanzig": 26,

    "siebenundzwanzig": 27,

    "achtundzwanzig": 28,

    "neunundzwanzig": 29,

    "dreißig": 30,
    "dreissig": 30,

    "einunddreißig": 31,
    "einunddreissig": 31
};


/* =====================================================
   ZAHLEN AUS TEXT HOLEN
   ===================================================== */

function findeZahlen(text) {

    let zahlen = [];


    let gesaeubert =
        text.replace(
            /\./g,
            " "
        );


    /*
    Ziffern wie 20 oder 06
    */

    const mitZiffern =
        gesaeubert.match(
            /\d+/g
        );


    if (mitZiffern) {

        for (
            const zahl of mitZiffern
        ) {

            const wert =
                parseInt(
                    zahl,
                    10
                );


            if (!isNaN(wert)) {

                zahlen.push(wert);
            }
        }
    }


    /*
    Zahlwörter
    */

    const woerter =
        gesaeubert
            .toLowerCase()
            .replace(
                /[.,!?;:]/g,
                " "
            )
            .split(/\s+/)
            .filter(Boolean);


    for (
        const wort of woerter
    ) {

        if (
            Object.prototype.hasOwnProperty.call(
                deutscheZahlen,
                wort
            )
        ) {

            zahlen.push(
                deutscheZahlen[wort]
            );
        }
    }


    return zahlen;
}


/* =====================================================
   DATUM DIREKT NACH „DEIN DATUM“ AUSLESEN
   ===================================================== */

const datumsOrdinalStamm = {
    "erst": 1,
    "zweit": 2,
    "dritt": 3,
    "viert": 4,
    "fünft": 5,
    "funft": 5,
    "sechst": 6,
    "siebt": 7,
    "acht": 8,
    "neunt": 9,
    "zehnt": 10,
    "elft": 11,
    "zwölft": 12,
    "zwolft": 12,
    "dreizehnt": 13,
    "vierzehnt": 14,
    "fünfzehnt": 15,
    "funfzehnt": 15,
    "sechzehnt": 16,
    "siebzehnt": 17,
    "achtzehnt": 18,
    "neunzehnt": 19,
    "zwanzigst": 20,
    "einundzwanzigst": 21,
    "zweiundzwanzigst": 22,
    "dreiundzwanzigst": 23,
    "vierundzwanzigst": 24,
    "fünfundzwanzigst": 25,
    "funfundzwanzigst": 25,
    "sechsundzwanzigst": 26,
    "siebenundzwanzigst": 27,
    "achtundzwanzigst": 28,
    "neunundzwanzigst": 29,
    "dreißigst": 30,
    "dreissigst": 30,
    "einunddreißigst": 31,
    "einunddreissigst": 31
};


function datumsWertAusWort(wort) {

    const sauber =
        wort
            .toLowerCase()
            .replace(/^[^a-zäöüß0-9]+|[^a-zäöüß0-9]+$/g, "");


    if (/^\d{1,2}$/.test(sauber)) {

        return parseInt(
            sauber,
            10
        );
    }


    if (
        Object.prototype.hasOwnProperty.call(
            deutscheZahlen,
            sauber
        )
    ) {

        return deutscheZahlen[
            sauber
        ];
    }


    /*
    Ordinalformen normalisieren:
    erste / erster / ersten / erstem / erstes -> erst
    zweite / zweiter / zweiten ...            -> zweit
    */
    const ordinalStamm =
        sauber.replace(
            /(e|en|er|em|es)$/i,
            ""
        );


    if (
        Object.prototype.hasOwnProperty.call(
            datumsOrdinalStamm,
            ordinalStamm
        )
    ) {

        return datumsOrdinalStamm[
            ordinalStamm
        ];
    }


    return null;
}


function findeDatumDirektNachDeinDatum(text) {

    const trigger =
        "dein datum";

    const triggerPosition =
        text.indexOf(
            trigger
        );


    if (
        triggerPosition === -1
    ) {

        return null;
    }


    /*
    Nur der Text NACH „DEIN DATUM“ wird untersucht.
    Punkte und typische Datumstrenner werden als echte
    Trennung behandelt, damit z. B. 03.02 -> 03 / 02 wird.
    */
    const nachDatum =
        text
            .substring(
                triggerPosition +
                trigger.length
            )
            .toLowerCase()
            .replace(
                /[.\/\\-]/g,
                " "
            )
            .replace(
                /[,!?;:]/g,
                " "
            );


    const woerter =
        nachDatum
            .split(/\s+/)
            .filter(Boolean);


    const werte = [];


    for (
        const wort of woerter
    ) {

        const wert =
            datumsWertAusWort(
                wort
            );


        if (
            wert !== null
        ) {

            werte.push(
                wert
            );


            /*
            Sobald zwei getrennte Werte vorliegen,
            haben wir Tag und Monat.
            */
            if (
                werte.length >= 2
            ) {

                break;
            }
        }
    }


    if (
        werte.length < 2
    ) {

        return null;
    }


    const tag =
        werte[0];

    const monat =
        werte[1];


    if (
        tag < 1 ||
        tag > 31 ||
        monat < 1 ||
        monat > 12
    ) {

        return null;
    }


    return {
        tag,
        monat
    };
}


/* =====================================================
   CODEWÖRTER ROBUST ERKENNEN
   ===================================================== */

function verarbeiteCodewoerter(text) {

    let etwasGefunden = false;


    /*
    Leerzeichen zwischen Zahl und „mal“
    normalisieren.

    WICHTIG:
    Nur Kombinationen mit „mal“ werden
    als Kartenwert-Code erkannt.

    „eins“ / „zwei“ / „drei“ / „vier“
    allein zählen NICHT.
    */

    text = text
        .toLowerCase()
        .replace(
            /\bein\s+mal\b/g,
            "einmal"
        )
        .replace(
            /\bzwei\s+mal\b/g,
            "zweimal"
        )
        .replace(
            /\bdrei\s+mal\b/g,
            "dreimal"
        )
        .replace(
            /\bvier\s+mal\b/g,
            "viermal"
        );


    /* -----------------------------------------
       HÄNDE = +10
       ----------------------------------------- */

    if (
        /\bhänden\b/.test(text) ||
        /\bhaenden\b/.test(text)
    ) {

        kartenWert += 10;

        etwasGefunden = true;

        logToConsole(
            "👉 [CODE] HÄNDEN erkannt (+10)"
        );
    }


    /* -----------------------------------------
       EINMAL = +1
       ----------------------------------------- */

    if (
        /\beinmal\b/.test(text)
    ) {

        kartenWert += 1;

        etwasGefunden = true;

        logToConsole(
            "👉 [CODE] EINMAL erkannt (+1)"
        );
    }


    /* -----------------------------------------
       ZWEIMAL = +2
       ----------------------------------------- */

    if (
        /\bzweimal\b/.test(text)
    ) {

        kartenWert += 2;

        etwasGefunden = true;

        logToConsole(
            "👉 [CODE] ZWEIMAL erkannt (+2)"
        );
    }


    /* -----------------------------------------
       DREIMAL = +3
       ----------------------------------------- */

    if (
        /\bdreimal\b/.test(text)
    ) {

        kartenWert += 3;

        etwasGefunden = true;

        logToConsole(
            "👉 [CODE] DREIMAL erkannt (+3)"
        );
    }


    /* -----------------------------------------
       VIERMAL = +4
       ----------------------------------------- */

    if (
        /\bviermal\b/.test(text)
    ) {

        kartenWert += 4;

        etwasGefunden = true;

        logToConsole(
            "👉 [CODE] VIERMAL erkannt (+4)"
        );
    }


    /* -----------------------------------------
       HAND = +5

       HÄNDEN darf nicht zusätzlich
       als HAND gezählt werden.
       ----------------------------------------- */

    if (
        !/\bhänden\b/.test(text) &&
        !/\bhaenden\b/.test(text) &&
        /\bhand\b/.test(text)
    ) {

        kartenWert += 5;

        etwasGefunden = true;

        logToConsole(
            "👉 [CODE] HAND erkannt (+5)"
        );
    }


    if (etwasGefunden) {

        logToConsole(
            "📊 RECHENWERT AKTUELL: " +
            kartenWert
        );
    }
}


/* =====================================================
   BROWSERPRÜFUNG
   ===================================================== */

if (!SpeechRecognition) {

    logToConsole(
        "❌ FEHLER: Dieser Browser unterstützt webkitSpeechRecognition nicht!"
    );

} else {


    /* =================================================
       SPEECH RECOGNITION ERSTELLEN
       ================================================= */

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "de-DE";


    /*
    Wichtig für Android:
    continuous bleibt FALSE.
    Der Neustart erfolgt kontrolliert
    über onend.
    */

    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    /* =================================================
       STATUS-EVENTS
       ================================================= */

    recognition.onstart = () => {
        diagnoseSitzung++;
        diagnoseStarts++;
        diagnoseAktuelleSitzungHatResultat = false;
        diagnoseAktuelleSitzungHatSpeech = false;
        if (testStartZeit === null) testStartZeit = performance.now();
        diagnoseLog("START");
        speichereSitzungsEvent("START");

        logToConsole(
            "🎤 SPRACHERKENNUNG GESTARTET"
        );
    };


    recognition.onaudiostart = () => {
        diagnoseAudioStarts++;
        diagnoseLog("AUDIOSTART");
        speichereSitzungsEvent("AUDIOSTART");

        logToConsole(
            "🎧 MIKROFON / AUDIO AKTIV"
        );
    };


    recognition.onspeechstart = () => {
        diagnoseSpeechStarts++;
        diagnoseAktuelleSitzungHatSpeech = true;
        diagnoseLog("SPEECHSTART");
        speichereSitzungsEvent("SPEECHSTART");

        logToConsole(
            "🗣️ SPRACHE ERKANNT"
        );
    };


    recognition.onspeechend = () => {
        diagnoseSpeechEnds++;
        diagnoseLog("SPEECHEND");
        speichereSitzungsEvent("SPEECHEND");
    };

    recognition.onaudioend = () => {
        diagnoseAudioEnds++;
        diagnoseLog("AUDIOEND");
        speichereSitzungsEvent("AUDIOEND");
    };


    /* =================================================
       FEHLERBEHANDLUNG
       ================================================= */

    recognition.onerror =
        (event) => {
            diagnoseErrors++;
            diagnoseLog("ERROR", event.error);

            logToConsole(
                "⚠️ SPRACHERKENNUNGS-FEHLER: " +
                event.error
            );


            if (
                (
                    event.error ===
                    "no-speech"
                ) ||
                (
                    event.error ===
                    "aborted"
                )
            ) {

                if (
                    phase < 4
                ) {

                    setTimeout(
                        () => {

                            try {

                                recognition.start();

                            } catch (e) {

                                /*
                                onend übernimmt
                                ebenfalls den
                                normalen Neustart.
                                */

                            }

                        },
                        250
                    );
                }
            }
        };


    /* =================================================
       SPRACHERGEBNIS
       ================================================= */

    recognition.onresult =
        (event) => {
            diagnoseResults++;
            diagnoseAktuelleSitzungHatResultat = true;
            diagnoseLog("RESULT", "results.length=" + event.results.length);


            for (
                let i =
                    verarbeitetesResultat;

                i <
                event.results.length;

                i++
            ) {


                const result =
                    event.results[i];


                if (
                    !result ||
                    !result[0]
                ) {

                    continue;
                }


                let roherText =
                    result[0].transcript;


                if (!roherText) {

                    continue;
                }


                roherText =
                    roherText
                        .toLowerCase()
                        .trim();


                verarbeitetesResultat =
                    i + 1;


                /* =====================================
                   SPRACHAUFARBEITUNG
                   ===================================== */

                let text =
                    roherText

                        .replace(
                            /ein\s+mal/g,
                            "einmal"
                        )

                        .replace(
                            /zwei\s+mal/g,
                            "zweimal"
                        )

                        .replace(
                            /drei\s+mal/g,
                            "dreimal"
                        )

                        .replace(
                            /vier\s+mal/g,
                            "viermal"
                        )

                        .replace(
                            /reihem\s+folge/g,
                            "reihenfolge"
                        )

                        .replace(
                            /reihen\s+folge/g,
                            "reihenfolge"
                        )

                        /*
                        Bereits getestete
                        Hörfehler
                        */

                        .replace(
                            /garten/g,
                            "reihenfolge"
                        )

                        .replace(
                            /kartendeckt/g,
                            "reihenfolge"
                        )

                        .replace(
                            /deckels/g,
                            "reihenfolge"
                        )

                        .replace(
                            /beachte/g,
                            "14"
                        )

                        .replace(
                            /achte/g,
                            "8"
                        )

                        .replace(
                            /ranz/g,
                            "franz"
                        )

                        .replace(
                            /wolf/g,
                            "12"
                        )

                        .replace(
                            /dein\s+datum/g,
                            "dein datum"
                        );


                erkannteTexte.push({
                    zeit: seitTestStart(),
                    sitzung: diagnoseSitzung,
                    text: roherText
                });

                timingCodewoerter(roherText);

                logToConsole(
                    "<br>📢 [GEHÖRT] „" +
                    roherText +
                    "“"
                );


                if (
                    roherText !== text
                ) {

                    logToConsole(
                        "✨ [GEBÜGELT] „" +
                        text +
                        "“"
                    );
                }


                verarbeiteSprache(
                    text
                );
            }
        };


    /* =====================================================
       HAUPTVERARBEITUNG DER PHASEN
       ===================================================== */

    function verarbeiteSprache(text) {


        logToConsole(
            "🔍 [ANALYSE] Prüfe Phase " +
            phase +
            "..."
        );


        /* ================================================
           PHASE 0
           ZUSAMMEN ODER DIESER STELLE
           ================================================ */

        if (
            phase === 0
        ) {

            const zusammenErkannt =
                text.includes("zusammen");

            const dieserStelleErkannt =
                text.includes("dieser stelle") ||
                text.includes("an dieser stelle") ||
                (
                    text.includes("dieser") &&
                    text.includes("stelle")
                );

            if (
                zusammenErkannt ||
                dieserStelleErkannt
            ) {

                if (
                    zusammenErkannt &&
                    dieserStelleErkannt
                ) {

                    startDurchBeideAnzahl += 1;

                    logToConsole(
                        "▶️ START: BEIDE erkannt – „DIESER STELLE“ + „ZUSAMMEN“"
                    );

                } else if (
                    dieserStelleErkannt
                ) {

                    startDurchDieserStelleAnzahl += 1;

                    logToConsole(
                        "▶️ START: „DIESER STELLE“ erkannt"
                    );

                } else {

                    startDurchZusammenAnzahl += 1;

                    logToConsole(
                        "▶️ START: „ZUSAMMEN“ erkannt"
                    );
                }

                logToConsole(
                    "📊 STARTSTATISTIK – ZUSAMMEN: " +
                    startDurchZusammenAnzahl +
                    " | DIESER STELLE: " +
                    startDurchDieserStelleAnzahl +
                    " | BEIDE: " +
                    startDurchBeideAnzahl
                );

                phase = 1;
                phase1Text = "";

                logToConsole(
                    "PHASE 1: SUCHE KARTENFARBE"
                );
            }

            return;
        }


        /* ================================================
           PHASE 1
           KARTENFARBE
           ================================================ */

        if (
            phase === 1
        ) {

            /*
            Sprachfragmente sammeln.
            */

            phase1Text +=
                " " + text;


            /*
            REIHEN FOLGE
            zusammenführen.
            */

            phase1Text =
                phase1Text.replace(
                    /reihen\s+folge/g,
                    "reihenfolge"
                );


            /*
            KARTENFARBE
            */

            if (
                phase1Text.includes(
                    "passiert"
                )
            ) {

                kartenFarbe =
                    "Pik ♠";


            } else if (
                phase1Text.includes(
                    "geschehen"
                )
            ) {

                kartenFarbe =
                    "Herz ♥";


            } else if (
                phase1Text.includes(
                    "gewesen"
                )
            ) {

                kartenFarbe =
                    "Kreuz ♣";


            } else if (
                phase1Text.includes(
                    "gehabt"
                )
            ) {

                kartenFarbe =
                    "Karo ♦";
            }


            /*
            Farbe gefunden
            */

            if (
                kartenFarbe !== ""
            ) {

                logToConsole(
                    "🃏 KARTENFARBE: " +
                    kartenFarbe
                );


                phase = 2;


                /*
                Ganz wichtig:
                Phase 2 bekommt einen
                leeren Puffer.
                */

                phase2Text =
                    "";


                logToConsole(
                    "PHASE 2: CODEWÖRTER ZÄHLEN"
                );


                return;
            }


            return;
        }


        /* ================================================
           PHASE 2
           CODEWÖRTER + REIHENFOLGE
           ================================================ */

        if (
            phase === 2
        ) {

            /*
            Alle Sprachfragmente sammeln.
            */

            phase2Text +=
                " " + text;


            /*
            Getrennt gehörtes
            REIHEN FOLGE zusammenführen.
            */

            phase2Text =
                phase2Text.replace(
                    /reihen\s+folge/g,
                    "reihenfolge"
                );


            /*
            AKTUELLES SPRACHFRAGMENT
            nach Codewörtern durchsuchen.

            Wichtig:
            verarbeiteCodewoerter()
            erkennt nur:

            einmal
            zweimal
            dreimal
            viermal
            hand
            händen

            Reine Zahlen wie
            „eins“, „zwei“, „drei“
            werden hier NICHT gezählt.
            */

            verarbeiteCodewoerter(
                text
            );


            /*
            REIHENFOLGE / KARTENFOLGE
            */

            const reihenfolgeErkannt =
                phase2Text.includes(
                    "reihenfolge"
                );


            const folgeKartenErkannt =
                phase2Text.includes("folge") &&
                phase2Text.includes("karten") &&
                phase2Text.includes("bestimmt");


            const kartenDeckBestimmt =
                phase2Text.includes("karten") &&
                phase2Text.includes("deck") &&
                phase2Text.includes("bestimmt");


            if (
                reihenfolgeErkannt ||
                folgeKartenErkannt ||
                kartenDeckBestimmt
            ) {

                phase = 3;

                phase3Text = "";


                logToConsole(
                    "🔒 KARTENFOLGE / REIHENFOLGE ERKANNT"
                );


                logToConsole(
                    "KARTENWERT FESTGESETZT: " +
                    kartenWert
                );


                logToConsole(
                    "PHASE 3: NAME / DATUM"
                );


                return;
            }


            return;
        }


        /* ================================================
           PHASE 3
           NAME / DATUM / HEUTE / VERDECKT
           ================================================ */

        if (
            phase === 3
        ) {


            /*
            Alle Sprachfragmente
            aus Phase 3 sammeln.
            */

            phase3Text +=
                " " + text;


            /* --------------------------------------------
               NAME
               -------------------------------------------- */

            const datumPosition =
                phase3Text.indexOf(
                    "dein datum"
                );


            if (
                datumPosition > 0 &&
                zuschauerName === ""
            ) {


                let nameTeil =
                    phase3Text
                        .substring(
                            0,
                            datumPosition
                        )
                        .trim();


                const woerter =
                    nameTeil.split(
                        /\s+/
                    );


                if (
                    woerter.length > 0
                ) {


                    nameTeil =
                        woerter[
                            woerter.length - 1
                        ]
                        .replace(
                            /^[,.:;!? ]+|[,.:;!? ]+$/g,
                            ""
                        );


                    if (
                        nameTeil !== "" &&
                        nameTeil.toLowerCase() !==
                            "name"
                    ) {


                        zuschauerName =
                            nameTeil
                                .charAt(0)
                                .toUpperCase() +
                            nameTeil.slice(1);


                        logToConsole(
                            "👤 NAME: " +
                            zuschauerName
                        );
                    }
                }
            }


            /* --------------------------------------------
               HEUTE
               -------------------------------------------- */

            if (
                geburtsTag === null &&
                phase3Text.includes(
                    "heute"
                )
            ) {


                const heute =
                    new Date();


                geburtsTag =
                    heute.getDate();


                geburtsMonat =
                    heute.getMonth() + 1;


                geburtsDatum =
                    String(
                        geburtsTag
                    ).padStart(
                        2,
                        "0"
                    ) +
                    "." +
                    String(
                        geburtsMonat
                    ).padStart(
                        2,
                        "0"
                    );


                logToConsole(
                    "📅 DATUM: HEUTE → " +
                    geburtsDatum
                );
            }


            /* --------------------------------------------
               DATUM DIREKT NACH „DEIN DATUM“
               -------------------------------------------- */

            if (
                geburtsTag === null
            ) {

                const erkanntesDatum =
                    findeDatumDirektNachDeinDatum(
                        phase3Text
                    );


                if (
                    erkanntesDatum
                ) {

                    geburtsTag =
                        erkanntesDatum.tag;

                    geburtsMonat =
                        erkanntesDatum.monat;

                    geburtsDatum =
                        String(
                            geburtsTag
                        ).padStart(
                            2,
                            "0"
                        ) +
                        "." +
                        String(
                            geburtsMonat
                        ).padStart(
                            2,
                            "0"
                        );


                    logToConsole(
                        "📅 DATUM DIREKT NACH „DEIN DATUM“: " +
                        geburtsDatum
                    );
                }
            }


            /* --------------------------------------------
               VERDECKT / UNBEKANNT = ABSCHLUSS
               -------------------------------------------- */

            if (
                phase3Text.includes(
                    "verdeckt"
                ) ||
                phase3Text.includes(
                    "unbekannt"
                )
            ) {


                phase = 4;


                logToConsole(
                    "🛑 „VERDECKT“ / „UNBEKANNT“ ERKANNT"
                );


                logToConsole(
                    "🎤 SPRACHERKENNUNG WIRD BEENDET"
                );


                /*
                Geburtstag prüfen
                */

                const heute =
                    new Date();


                const heuteTag =
                    heute.getDate();


                const heuteMonat =
                    heute.getMonth() + 1;


                istGeburtstag =
                    geburtsTag ===
                        heuteTag &&
                    geburtsMonat ===
                        heuteMonat;


                /*
                ERGEBNIS
                */

                logToConsole(
                    "--------------------------------"
                );


                logToConsole(
                    "ERGEBNIS"
                );


                logToConsole(
                    "FARBE: " +
                    kartenFarbe
                );


                logToConsole(
                    "WERT: " +
                    kartenWert
                );


                logToConsole(
                    "NAME: " +
                    (
                        zuschauerName ||
                        "(kein Name erkannt)"
                    )
                );


                logToConsole(
                    "DATUM: " +
                    (
                        geburtsDatum ||
                        "(kein Datum erkannt)"
                    )
                );


                logToConsole(
                    "GEBURTSTAG: " +
                    (
                        istGeburtstag
                            ? "JA 🎂"
                            : "NEIN"
                    )
                );


                logToConsole(
                    "--------------------------------"
                );


                /*
                SPRACHLABOR 4.3:
                „VERDECKT“ / „UNBEKANNT“ beendet nur die Programmlogik.
                Der Test selbst läuft weiter, bis
                TEST BEENDEN gedrückt wird.
                */

                logToConsole(
                    "🧪 LABOR: Abschlusswort erkannt – Test läuft weiter bis zum manuellen Ende."
                );


                return;
            }


            return;
        }
    }


    /* =====================================================
       MIKROFON-RESTART
       ===================================================== */

    let neustartTimer = null;

    let antiLoopSperre = false;


    recognition.onend = () => {
        diagnoseEnds++;

        if (!diagnoseAktuelleSitzungHatResultat) {
            diagnoseLeereEnds++;
        }

        diagnoseLog(
            "END",
            "Speech=" + (diagnoseAktuelleSitzungHatSpeech ? "JA" : "NEIN") +
            " | Resultat=" + (diagnoseAktuelleSitzungHatResultat ? "JA" : "NEIN")
        );
        speichereSitzungsEvent("END");
        diagnoseStatistik();


        /*
        Nach „Verdeckt“
        NICHT wieder starten.
        */

        if (
            testBeendet
        ) {

            return;
        }


        /*
        Verhindert mehrere
        gleichzeitige Neustarts.
        */

        if (
            antiLoopSperre
        ) {

            return;
        }


        antiLoopSperre =
            true;


        if (
            neustartTimer
        ) {

            clearTimeout(
                neustartTimer
            );
        }


        neustartTimer =
            setTimeout(
                () => {


                    try {


                        verarbeitetesResultat =
                            0;


                        recognition.start();


                        setTimeout(
                            () => {

                                antiLoopSperre =
                                    false;

                            },
                            1000
                        );


                    } catch (e) {


                        antiLoopSperre =
                            false;
                    }


                },
                800
            );
    };


    /* =====================================================
       ERSTER START
       ===================================================== */

    try {

        recognition.start();

    } catch (e) {

        logToConsole(
            "❌ STARTFEHLER: " +
            e.message
        );
    }

}


document
    .getElementById("end-test-btn")
    .addEventListener("click", beendeTestManuell);

document
    .getElementById("new-test-btn")
    .addEventListener("click", starteNeuenTest);


/* =====================================================
   NOT-AUS
   3 SEKUNDEN OBEN LINKS GEDRÜCKT HALTEN
   ===================================================== */

let exitTimer = null;


document
    .getElementById(
        "emergency-exit"
    )
    .addEventListener(
        "touchstart",
        () => {


            exitTimer =
                setTimeout(
                    () => {

                        location.reload();

                    },
                    3000
                );
        }
    );


document
    .getElementById(
        "emergency-exit"
    )
    .addEventListener(
        "touchend",
        () => {

            clearTimeout(
                exitTimer
            );

        }
    );

</script>
